<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourBot - Interactive Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .robot-container {
            position: relative;
            width: 500px;
            height: 560px;
            perspective: 1000px;
        }

        .robot-face {
            position: relative;
            width: 100%;
            height: 100%;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* Robot head */
        .head {
            position: absolute;
            width: 375px;
            height: 400px;
            background: linear-gradient(145deg, #f0f0f0, #d4d4d4);
            border-radius: 75px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 2px 10px rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }

        /* Antenna */
        .antenna {
            position: absolute;
            width: 8px;
            height: 62px;
            background: linear-gradient(to bottom, #888, #666);
            left: 50%;
            top: -50px;
            transform: translateX(-50%);
            border-radius: 4px;
        }

        .antenna-ball {
            position: absolute;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #ee5a6f);
            border-radius: 50%;
            left: 50%;
            top: -62px;
            transform: translateX(-50%);
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
            }

            50% {
                transform: translateX(-50%) scale(1.2);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.9);
            }
        }

        /* Eyes container */
        .eyes {
            position: absolute;
            width: 300px;
            top: 125px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
        }

        .eye {
            position: relative;
            width: 100px;
            height: 125px;
            background: #2c3e50;
            border-radius: 50px;
            box-shadow:
                inset 0 5px 15px rgba(0, 0, 0, 0.5),
                0 2px 5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .pupil {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #4ecdc4, #2c9e96);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 0 40px rgba(78, 205, 196, 0.6),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
            animation: look-around 4s ease-in-out infinite;
        }

        @keyframes look-around {

            0%,
            100% {
                transform: translate(-50%, -50%);
            }

            25% {
                transform: translate(-30%, -50%);
            }

            50% {
                transform: translate(-50%, -40%);
            }

            75% {
                transform: translate(-70%, -50%);
            }
        }

        .pupil-shine {
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 10px;
            left: 12px;
            box-shadow: 5px 5px 10px rgba(255, 255, 255, 0.5);
        }

        /* Blinking animation */
        .eye::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2c3e50;
            top: -100%;
            left: 0;
            animation: blink 5s infinite;
            z-index: 10;
        }

        @keyframes blink {

            0%,
            48%,
            52%,
            100% {
                top: -100%;
            }

            49%,
            51% {
                top: 0;
            }
        }

        /* Cheeks */
        .cheeks {
            position: absolute;
            width: 100%;
            top: 175px;
            left: 0;
        }

        .cheek {
            position: absolute;
            width: 50px;
            height: 38px;
            background: radial-gradient(ellipse, rgba(255, 107, 107, 0.6), transparent);
            border-radius: 50%;
            animation: blush 3s ease-in-out infinite;
        }

        .cheek.left {
            left: 25px;
        }

        .cheek.right {
            right: 25px;
        }

        @keyframes blush {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        /* Mouth */
        .mouth {
            position: absolute;
            width: 175px;
            height: 88px;
            left: 50%;
            bottom: 88px;
            transform: translateX(-50%);
            overflow: hidden;
        }

        .mouth-shape {
            position: absolute;
            width: 175px;
            height: 175px;
            border: 8px solid #2c3e50;
            border-radius: 50%;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: smile 4s ease-in-out infinite;
        }

        @keyframes smile {

            0%,
            100% {
                height: 175px;
                border-color: #2c3e50;
            }

            50% {
                height: 200px;
                border-color: #34495e;
            }
        }

        /* Screen lines decoration */
        .screen-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(to right,
                    transparent,
                    rgba(255, 255, 255, 0.1),
                    transparent);
            width: 100%;
            animation: scan 3s linear infinite;
        }

        .screen-line:nth-child(1) {
            top: 20%;
            animation-delay: 0s;
        }

        .screen-line:nth-child(2) {
            top: 40%;
            animation-delay: 0.5s;
        }

        .screen-line:nth-child(3) {
            top: 60%;
            animation-delay: 1s;
        }

        .screen-line:nth-child(4) {
            top: 80%;
            animation-delay: 1.5s;
        }

        @keyframes scan {
            0% {
                transform: translateY(-10px);
                opacity: 0;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(10px);
                opacity: 0;
            }
        }

        /* Speaking mode */
        .speaking .mouth-shape {
            animation: speaking 0.3s ease-in-out infinite;
        }

        @keyframes speaking {

            0%,
            100% {
                height: 150px;
            }

            50% {
                height: 200px;
            }
        }

        /* Happy mode */
        .happy .head {
            animation: wobble 0.5s ease-in-out;
        }

        @keyframes wobble {

            0%,
            100% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            25% {
                transform: translate(-50%, -50%) rotate(-5deg);
            }

            75% {
                transform: translate(-50%, -50%) rotate(5deg);
            }
        }

        /* Thinking mode */
        .thinking .antenna-ball {
            animation: thinking-pulse 1s ease-in-out infinite;
        }

        @keyframes thinking-pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                background: radial-gradient(circle at 30% 30%, #4ecdc4, #2c9e96);
            }

            50% {
                transform: translateX(-50%) scale(1.2);
                background: radial-gradient(circle at 30% 30%, #4ecdc4, #44d9ce);
            }
        }

        /* Control section */
        .control-section {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .start-button {
            background: white;
            color: #764ba2;
            border: none;
            padding: 30px 90px;
            font-size: 2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .start-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            background: #f8f8f8;
        }

        .start-button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .start-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background: #e0e0e0;
        }

        .waypoint-display {
            color: white;
            font-size: 1.4em;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            margin-bottom: 10px;
        }

        .error-message {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(211, 47, 47, 0.95);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: none;
        }

        /* Running state animations */
        .tour-running .robot-face {
            animation: float 2s ease-in-out infinite;
        }

        .tour-running .antenna-ball {
            animation: pulse-fast 1s ease-in-out infinite;
        }

        @keyframes pulse-fast {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
            }

            50% {
                transform: translateX(-50%) scale(1.3);
                box-shadow: 0 0 50px rgba(255, 107, 107, 1);
            }
        }
    </style>
</head>

<body>
    <div class="container" id="mainContainer">
        <div class="robot-container">
            <div class="robot-face" id="robotFace">
                <div class="head">
                    <div class="antenna"></div>
                    <div class="antenna-ball"></div>

                    <div class="eyes">
                        <div class="eye">
                            <div class="pupil">
                                <div class="pupil-shine"></div>
                            </div>
                        </div>
                        <div class="eye">
                            <div class="pupil">
                                <div class="pupil-shine"></div>
                            </div>
                        </div>
                    </div>

                    <div class="cheeks">
                        <div class="cheek left"></div>
                        <div class="cheek right"></div>
                    </div>

                    <div class="mouth">
                        <div class="mouth-shape"></div>
                    </div>

                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="control-section">
        <div id="waypoint-display" class="waypoint-display" style="display: none;"></div>
        <button id="start-button" class="start-button">Start Tour</button>
    </div>

    <div id="error-message" class="error-message"></div>

    <script>
        const API_BASE = window.location.origin;

        const startButton = document.getElementById('start-button');
        const waypointDisplay = document.getElementById('waypoint-display');
        const errorMessage = document.getElementById('error-message');
        const robotFace = document.getElementById('robotFace');
        const mainContainer = document.getElementById('mainContainer');

        // Track current state
        let currentUtterance = null;
        let lastWaypoint = null;
        let lastScript = null;
        let statusPollInterval = null;

        // Speech synthesis function with completion callback
        function speak(text, onComplete) {
            return new Promise((resolve, reject) => {
                if (!('speechSynthesis' in window)) {
                    console.warn('Speech synthesis not supported');
                    resolve();
                    return;
                }

                // Cancel any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                utterance.onend = () => {
                    console.log('Speech finished');
                    currentUtterance = null;
                    if (onComplete) onComplete();
                    resolve();
                };

                utterance.onerror = (event) => {
                    console.error('Speech error:', event);
                    currentUtterance = null;
                    if (onComplete) onComplete();
                    resolve(); // Resolve anyway to not block the tour
                };

                currentUtterance = utterance;
                window.speechSynthesis.speak(utterance);
            });
        }

        // Signal to backend that audio is complete
        async function signalAudioComplete() {
            try {
                await fetch(`${API_BASE}/tour/audio-complete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                console.log('Signaled audio completion to backend');
            } catch (error) {
                console.error('Error signaling audio completion:', error);
            }
        }

        // Update UI based on tour status
        function updateStatus(status, waypoint = null, error = null) {
            // Reset robot modes
            robotFace.classList.remove('happy', 'speaking', 'thinking');
            mainContainer.classList.remove('tour-running');

            switch (status) {
                case 'idle':
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour';
                    waypointDisplay.style.display = 'none';
                    // Trigger happy occasionally
                    triggerHappy();
                    break;

                case 'running':
                    startButton.disabled = true;
                    startButton.textContent = 'Tour Running...';
                    mainContainer.classList.add('tour-running');

                    if (waypoint) {
                        waypointDisplay.textContent = `📍 ${waypoint}`;
                        waypointDisplay.style.display = 'block';
                    }
                    break;

                case 'completed':
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour';
                    waypointDisplay.style.display = 'none';
                    triggerHappy();
                    break;

                case 'failed':
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour';
                    waypointDisplay.style.display = 'none';
                    break;
            }

            // Show/hide error message
            if (error) {
                errorMessage.textContent = error;
                errorMessage.style.display = 'block';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }
        }

        // Robot animation triggers
        function triggerHappy() {
            robotFace.classList.remove('speaking', 'thinking');
            robotFace.classList.add('happy');
            setTimeout(() => {
                robotFace.classList.remove('happy');
            }, 500);
        }

        function triggerSpeaking() {
            robotFace.classList.remove('happy', 'thinking');
            robotFace.classList.add('speaking');
        }

        function stopSpeaking() {
            robotFace.classList.remove('speaking');
        }

        // Start tour
        async function startTour() {
            try {
                errorMessage.style.display = 'none';

                // Send POST request to start tour
                const response = await fetch(`${API_BASE}/tour/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({})
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to start tour');
                }

                const data = await response.json();
                console.log('Tour started with waypoints:', data.waypoints);

                // Update UI
                updateStatus('running');

                // Start polling for status
                pollStatus();

            } catch (error) {
                console.error('Error starting tour:', error);
                updateStatus('idle', null, error.message);
            }
        }

        // Poll tour status and handle audio playback
        async function pollStatus() {
            // Clear any existing interval
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
            }

            statusPollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/tour/status`);
                    const data = await response.json();

                    // Use 'introduction' as waypoint identifier when no waypoint is set
                    const currentWaypoint = data.current_waypoint || 'introduction';

                    // Check if we have a new script to play
                    if (data.script &&
                        (currentWaypoint !== lastWaypoint || data.script !== lastScript)) {

                        lastWaypoint = currentWaypoint;
                        lastScript = data.script;

                        console.log(`New waypoint: ${currentWaypoint}`);
                        console.log(`Script: ${data.script}`);

                        // Trigger speaking animation
                        triggerSpeaking();

                        // Play the script audio and signal completion when done
                        await speak(data.script, () => {
                            stopSpeaking();
                            signalAudioComplete();
                        });
                    }

                    updateStatus(data.status, data.current_waypoint);

                    // Stop polling if tour is complete or failed
                    if (data.status === 'completed' || data.status === 'failed') {
                        clearInterval(statusPollInterval);
                        lastWaypoint = null;
                        lastScript = null;
                        stopSpeaking();

                        if (data.status === 'completed') {
                            console.log('Tour completed!');
                        }
                    }
                } catch (error) {
                    console.error('Error polling status:', error);
                }
            }, 500); // Poll every 500ms for responsiveness
        }

        // Check initial status on load
        async function checkInitialStatus() {
            try {
                const response = await fetch(`${API_BASE}/tour/status`);
                const data = await response.json();
                updateStatus(data.status, data.current_waypoint);

                // If tour is running, start polling
                if (data.status === 'running') {
                    // Initialize lastWaypoint to avoid re-announcing current waypoint
                    lastWaypoint = data.current_waypoint;
                    lastScript = data.script;
                    pollStatus();
                }
            } catch (error) {
                console.error('Error checking initial status:', error);
            }
        }

        // Event listeners
        startButton.addEventListener('click', startTour);

        // Initialize
        checkInitialStatus();

        // Random happy expressions when idle
        setInterval(() => {
            if (!mainContainer.classList.contains('tour-running')) {
                triggerHappy();
            }
        }, 8000);
    </script>
</body>

</html>
