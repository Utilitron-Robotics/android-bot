<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TourBot - Pre-recorded Audio Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }

        .robot-container {
            position: relative;
            width: 500px;
            height: 560px;
            perspective: 1000px;
            transition: all 0.6s ease;
        }

        /* Idle state - blurred face */
        .idle .robot-container {
            filter: blur(12px);
            opacity: 0.25;
            transform: scale(0.95);
        }

        /* Running state - clear face */
        .tour-running .robot-container {
            filter: blur(0);
            opacity: 1;
            transform: scale(1);
        }

        .robot-face {
            position: relative;
            width: 100%;
            height: 100%;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* Robot head */
        .head {
            position: absolute;
            width: 375px;
            height: 400px;
            background: linear-gradient(145deg, #f0f0f0, #d4d4d4);
            border-radius: 75px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 2px 10px rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }

        /* Antenna */
        .antenna {
            position: absolute;
            width: 8px;
            height: 62px;
            background: linear-gradient(to bottom, #888, #666);
            left: 50%;
            top: -50px;
            transform: translateX(-50%);
            border-radius: 4px;
        }

        .antenna-ball {
            position: absolute;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #ee5a6f);
            border-radius: 50%;
            left: 50%;
            top: -62px;
            transform: translateX(-50%);
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
            }

            50% {
                transform: translateX(-50%) scale(1.2);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.9);
            }
        }

        /* Eyes container */
        .eyes {
            position: absolute;
            width: 300px;
            top: 125px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
        }

        .eye {
            position: relative;
            width: 100px;
            height: 125px;
            background: #2c3e50;
            border-radius: 50px;
            box-shadow:
                inset 0 5px 15px rgba(0, 0, 0, 0.5),
                0 2px 5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .pupil {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #4ecdc4, #2c9e96);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 0 40px rgba(78, 205, 196, 0.6),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
            animation: look-around 4s ease-in-out infinite;
        }

        @keyframes look-around {

            0%,
            100% {
                transform: translate(-50%, -50%);
            }

            25% {
                transform: translate(-30%, -50%);
            }

            50% {
                transform: translate(-50%, -40%);
            }

            75% {
                transform: translate(-70%, -50%);
            }
        }

        .pupil-shine {
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 10px;
            left: 12px;
            box-shadow: 5px 5px 10px rgba(255, 255, 255, 0.5);
        }

        /* Blinking animation */
        .eye::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2c3e50;
            top: -100%;
            left: 0;
            animation: blink 5s infinite;
            z-index: 10;
        }

        @keyframes blink {

            0%,
            48%,
            52%,
            100% {
                top: -100%;
            }

            49%,
            51% {
                top: 0;
            }
        }

        /* Cheeks */
        .cheeks {
            position: absolute;
            width: 100%;
            top: 175px;
            left: 0;
        }

        .cheek {
            position: absolute;
            width: 50px;
            height: 38px;
            background: radial-gradient(ellipse, rgba(255, 107, 107, 0.6), transparent);
            border-radius: 50%;
            animation: blush 3s ease-in-out infinite;
        }

        .cheek.left {
            left: 25px;
        }

        .cheek.right {
            right: 25px;
        }

        @keyframes blush {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        /* Mouth Style - Solid filled shape */
        .mouth {
            position: absolute;
            width: 180px;
            height: 90px;
            left: 50%;
            bottom: 55px;
            transform: translateX(-50%);
            overflow: hidden;
        }

        .mouth-shape {
            position: absolute;
            width: 180px;
            height: 180px;
            background: #2c3e50;
            border-radius: 50%;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            transition: height 0.05s ease-out, width 0.05s ease-out, bottom 0.05s ease-out;
        }

        /* Default smile animation when not speaking */
        .mouth-shape.idle-animation {
            animation: smile 4s ease-in-out infinite;
        }

        @keyframes smile {

            0%,
            100% {
                height: 180px;
                width: 180px;
                bottom: 0px;
            }

            50% {
                height: 200px;
                width: 190px;
                bottom: -5px;
            }
        }

        /* Screen lines decoration */
        .screen-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(to right,
                    transparent,
                    rgba(255, 255, 255, 0.1),
                    transparent);
            width: 100%;
            animation: scan 3s linear infinite;
        }

        .screen-line:nth-child(1) {
            top: 20%;
            animation-delay: 0s;
        }

        .screen-line:nth-child(2) {
            top: 40%;
            animation-delay: 0.5s;
        }

        .screen-line:nth-child(3) {
            top: 60%;
            animation-delay: 1s;
        }

        .screen-line:nth-child(4) {
            top: 80%;
            animation-delay: 1.5s;
        }

        @keyframes scan {
            0% {
                transform: translateY(-10px);
                opacity: 0;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(10px);
                opacity: 0;
            }
        }

        /* Speaking mode - Enhanced with CSS fallback */
        .speaking .mouth-shape {
            /* CSS fallback animation in case JS doesn't work */
            animation: speaking-fallback 0.3s ease-in-out infinite;
        }

        @keyframes speaking-fallback {
            0%, 100% {
                height: 150px;
                width: 160px;
                bottom: 5px;
            }
            50% {
                height: 210px;
                width: 200px;
                bottom: -10px;
            }
        }

        .speaking .pupil {
            box-shadow:
                0 0 50px rgba(78, 205, 196, 0.9),
                0 0 25px rgba(78, 205, 196, 0.6),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
        }

        .speaking .antenna-ball {
            animation: pulse-speaking 0.6s ease-in-out infinite;
        }

        @keyframes pulse-speaking {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
            }

            50% {
                transform: translateX(-50%) scale(1.25);
                box-shadow: 0 0 45px rgba(255, 107, 107, 1);
            }
        }

        /* Happy mode */
        .happy .head {
            animation: wobble 0.5s ease-in-out;
        }

        @keyframes wobble {

            0%,
            100% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            25% {
                transform: translate(-50%, -50%) rotate(-5deg);
            }

            75% {
                transform: translate(-50%, -50%) rotate(5deg);
            }
        }

        /* Thinking mode */
        .thinking .antenna-ball {
            animation: thinking-pulse 1s ease-in-out infinite;
        }

        @keyframes thinking-pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                background: radial-gradient(circle at 30% 30%, #4ecdc4, #2c9e96);
            }

            50% {
                transform: translateX(-50%) scale(1.2);
                background: radial-gradient(circle at 30% 30%, #4ecdc4, #44d9ce);
            }
        }

        /* Start button - CENTERED when idle */
        .start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #764ba2;
            border: none;
            padding: 40px 100px;
            font-size: 3em;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-weight: 700;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 100;
            opacity: 1;
            pointer-events: auto;
        }

        .start-button:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: #f8f8f8;
        }

        .start-button:active:not(:disabled) {
            transform: translate(-50%, -50%) scale(0.98);
        }

        .start-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #e0e0e0;
        }

        /* Hide button when tour is running */
        .start-button.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.8);
        }

        /* Waypoint display - REMOVED */

        .error-message {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(211, 47, 47, 0.95);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 200;
        }

        /* Running state animations */
        .tour-running .robot-face {
            animation: float 2s ease-in-out infinite;
        }

        .tour-running .antenna-ball {
            animation: pulse-fast 1s ease-in-out infinite;
        }

        @keyframes pulse-fast {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
            }

            50% {
                transform: translateX(-50%) scale(1.3);
                box-shadow: 0 0 50px rgba(255, 107, 107, 1);
            }
        }

        /* Wake-up animation */
        @keyframes wakeUp {
            0% {
                filter: blur(12px);
                opacity: 0.25;
                transform: scale(0.95);
            }
            100% {
                filter: blur(0);
                opacity: 1;
                transform: scale(1);
            }
        }

        .waking-up .robot-container {
            animation: wakeUp 0.8s ease-out forwards;
        }

        /* Audio indicator */
        .audio-indicator {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .audio-indicator.active {
            display: flex;
        }

        .audio-bars {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 30px;
        }

        .audio-bar {
            width: 4px;
            background: white;
            border-radius: 2px;
            animation: audio-pulse 0.6s ease-in-out infinite;
        }

        .audio-bar:nth-child(1) { animation-delay: 0s; }
        .audio-bar:nth-child(2) { animation-delay: 0.1s; }
        .audio-bar:nth-child(3) { animation-delay: 0.2s; }
        .audio-bar:nth-child(4) { animation-delay: 0.15s; }
        .audio-bar:nth-child(5) { animation-delay: 0.05s; }

        @keyframes audio-pulse {
            0%, 100% { height: 8px; }
            50% { height: 25px; }
        }
    </style>
</head>

<body>
    <div class="container idle" id="mainContainer">
        <div class="robot-container">
            <div class="robot-face" id="robotFace">
                <div class="head">
                    <div class="antenna"></div>
                    <div class="antenna-ball"></div>

                    <div class="eyes">
                        <div class="eye">
                            <div class="pupil">
                                <div class="pupil-shine"></div>
                            </div>
                        </div>
                        <div class="eye">
                            <div class="pupil">
                                <div class="pupil-shine"></div>
                            </div>
                        </div>
                    </div>

                    <div class="cheeks">
                        <div class="cheek left"></div>
                        <div class="cheek right"></div>
                    </div>

                    <div class="mouth">
                        <div class="mouth-shape idle-animation" id="mouthShape"></div>
                    </div>

                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                </div>
            </div>
        </div>
    </div>

    <button id="start-button" class="start-button">Start Tour 👋</button>

    <div id="error-message" class="error-message"></div>

    <div id="audio-indicator" class="audio-indicator">
        <div class="audio-bars">
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const AUDIO_BASE = `${API_BASE}/audio`; // Audio files served from /audio endpoint

        const startButton = document.getElementById('start-button');
        const errorMessage = document.getElementById('error-message');
        const robotFace = document.getElementById('robotFace');
        const mainContainer = document.getElementById('mainContainer');
        const mouthShape = document.getElementById('mouthShape');
        const audioIndicator = document.getElementById('audio-indicator');

        // Track current state
        let currentAudio = null;
        let audioContext = null;
        let analyser = null;
        let lastWaypoint = null;
        let lastScript = null;
        let statusPollInterval = null;
        let mouthAnimationFrame = null;
        let isSpeaking = false;

        // Audio caching for performance optimization
        const audioCache = new Map();
        const audioFiles = [
            'start', 'armin', 'avatar', 'emerson', 
            'empty_1', 'empty_2', 'end', 'opendroids', 'utilitron'
        ];
        let isPreloading = false;
        let preloadComplete = false;

        // Audio-reactive mouth animation with real-time audio analysis
        class MouthAnimator {
            constructor(mouthElement) {
                this.mouth = mouthElement;
                this.isActive = false;
                this.targetHeight = 180;
                this.targetWidth = 180;
                this.targetBottom = 0;
                this.currentHeight = 180;
                this.currentWidth = 180;
                this.currentBottom = 0;
                this.smoothing = 0.3;
                this.analyser = null;
                this.dataArray = null;
            }

            start(analyserNode) {
                // Cancel any existing animation
                if (mouthAnimationFrame) {
                    cancelAnimationFrame(mouthAnimationFrame);
                    mouthAnimationFrame = null;
                }
                
                this.isActive = true;
                this.mouth.classList.remove('idle-animation');
                this.analyser = analyserNode;
                
                if (this.analyser) {
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                }
                
                this.animate();
            }

            stop() {
                this.isActive = false;
                
                // Cancel animation frame
                if (mouthAnimationFrame) {
                    cancelAnimationFrame(mouthAnimationFrame);
                    mouthAnimationFrame = null;
                }
                
                this.mouth.classList.add('idle-animation');
                this.currentHeight = 180;
                this.currentWidth = 180;
                this.currentBottom = 0;
                // Clear inline styles to let CSS animations work
                this.mouth.style.height = '';
                this.mouth.style.width = '';
                this.mouth.style.bottom = '';
            }

            animate() {
                if (!this.isActive) return;

                // Get real-time audio data
                let amplitude = 0;
                if (this.analyser && this.dataArray) {
                    this.analyser.getByteFrequencyData(this.dataArray);
                    
                    // Calculate average amplitude from frequency data
                    let sum = 0;
                    for (let i = 0; i < this.dataArray.length; i++) {
                        sum += this.dataArray[i];
                    }
                    amplitude = sum / this.dataArray.length / 255; // Normalize to 0-1
                } else {
                    // Fallback to generic animation if no analyser
                    amplitude = Math.abs(Math.sin(Date.now() * 0.01)) * 0.5 + 0.2;
                }

                // Map amplitude to mouth size
                const intensity = Math.min(1, amplitude * 2); // Amplify the effect
                
                // Animate height, width, and bottom position for filled mouth
                this.targetHeight = 180 + (intensity * 140);
                this.targetWidth = 180 + (intensity * 80);
                this.targetBottom = -(intensity * 15);

                // Add small random micro-movements for realism
                this.targetHeight += (Math.random() - 0.5) * 8;
                this.targetWidth += (Math.random() - 0.5) * 4;

                // Smooth interpolation
                this.currentHeight += (this.targetHeight - this.currentHeight) * this.smoothing;
                this.currentWidth += (this.targetWidth - this.currentWidth) * this.smoothing;
                this.currentBottom += (this.targetBottom - this.currentBottom) * this.smoothing;

                // Apply to mouth
                this.mouth.style.height = `${this.currentHeight}px`;
                this.mouth.style.width = `${this.currentWidth}px`;
                this.mouth.style.bottom = `${this.currentBottom}px`;

                // Continue animation
                mouthAnimationFrame = requestAnimationFrame(() => this.animate());
            }
        }

        const mouthAnimator = new MouthAnimator(mouthShape);

        // Initialize Web Audio API context
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                console.log('Audio context initialized');
            }
            // Resume context if suspended (required by some browsers)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Preload all audio files for instant playback
        async function preloadAudioFiles() {
            if (isPreloading || preloadComplete) {
                console.log('[Audio] Preload already in progress or complete');
                return;
            }

            isPreloading = true;
            console.log('[Audio] Starting preload of audio files...');
            
            const promises = audioFiles.map(file => {
                return new Promise((resolve) => {
                    const audio = new Audio(`${AUDIO_BASE}/${file}.wav`);
                    audio.preload = 'auto';
                    
                    audio.addEventListener('canplaythrough', () => {
                        audioCache.set(file, audio);
                        console.log(`[Audio] ✓ Cached: ${file}.wav`);
                        resolve();
                    });
                    
                    audio.addEventListener('error', (e) => {
                        console.warn(`[Audio] ⚠ Failed to preload: ${file}.wav`, e);
                        resolve(); // Don't block other loads
                    });
                    
                    // Start loading
                    audio.load();
                });
            });
            
            await Promise.all(promises);
            preloadComplete = true;
            isPreloading = false;
            console.log(`[Audio] ✓ Preloaded ${audioCache.size}/${audioFiles.length} audio files`);
        }

        // Play pre-recorded audio file with real-time mouth animation
        function playAudio(waypoint) {
            return new Promise((resolve, reject) => {
                // Construct audio file path
                // For 'start' waypoint (no current_waypoint), use 'start.wav'
                const audioFile = waypoint === 'introduction' ? 'start' : waypoint;
                const audioUrl = `${AUDIO_BASE}/${audioFile}.wav`;
                
                // Always create a fresh Audio element to avoid MediaElementSource conflicts
                // Browser will use cached file from preload, so this is still fast
                const audio = new Audio(audioUrl);
                
                // Log whether file was preloaded (will load instantly from browser cache)
                if (preloadComplete && audioCache.has(audioFile)) {
                    console.log(`[Audio] ✓ Playing (from browser cache): ${audioFile}.wav`);
                } else {
                    console.log(`[Audio] Loading: ${audioFile}.wav`);
                }
                
                audio.volume = 1.0;
                currentAudio = audio;

                // Initialize audio context and create analyser
                initAudioContext();
                
                const source = audioContext.createMediaElementSource(audio);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                // Connect: source -> analyser -> destination
                source.connect(analyser);
                analyser.connect(audioContext.destination);

                // Start mouth animation with analyser
                console.log('[Audio] Starting mouth animation with audio analysis');
                isSpeaking = true;
                audioIndicator.classList.add('active');
                mouthAnimator.start(analyser);

                audio.onplay = () => {
                    console.log('[Audio] Playback started');
                };

                audio.onended = () => {
                    console.log('[Audio] Playback finished');
                    currentAudio = null;
                    isSpeaking = false;
                    audioIndicator.classList.remove('active');
                    mouthAnimator.stop();
                    resolve();
                };

                audio.onerror = (event) => {
                    console.error('[Audio] Error loading audio:', audioUrl, event);
                    currentAudio = null;
                    isSpeaking = false;
                    audioIndicator.classList.remove('active');
                    mouthAnimator.stop();
                    
                    // Show error but don't block tour
                    showError(`Audio file not found: ${audioFile}.wav`);
                    resolve(); // Resolve anyway to not block the tour
                };

                // Start playback
                audio.play().catch(error => {
                    console.error('[Audio] Playback error:', error);
                    currentAudio = null;
                    isSpeaking = false;
                    audioIndicator.classList.remove('active');
                    mouthAnimator.stop();
                    resolve();
                });
            });
        }

        // Signal to backend that audio is complete
        async function signalAudioComplete() {
            try {
                await fetch(`${API_BASE}/tour/audio-complete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                console.log('Signaled audio completion to backend');
            } catch (error) {
                console.error('Error signaling audio completion:', error);
            }
        }

        // Update UI based on tour status
        function updateStatus(status, waypoint = null, error = null) {
            // Reset robot modes
            robotFace.classList.remove('happy', 'speaking', 'thinking');

            switch (status) {
                case 'idle':
                    mainContainer.classList.remove('tour-running', 'waking-up');
                    mainContainer.classList.add('idle');
                    startButton.classList.remove('hidden');
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour 👋';
                    break;

                case 'running':
                    startButton.classList.add('hidden');
                    startButton.disabled = true;
                    mainContainer.classList.remove('idle');
                    mainContainer.classList.add('tour-running');
                    break;

                case 'completed':
                    mainContainer.classList.remove('tour-running', 'waking-up');
                    mainContainer.classList.add('idle');
                    startButton.classList.remove('hidden');
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour 👋';
                    triggerHappy();
                    break;

                case 'failed':
                    mainContainer.classList.remove('tour-running', 'waking-up');
                    mainContainer.classList.add('idle');
                    startButton.classList.remove('hidden');
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour 👋';
                    break;
            }

            // Show/hide error message
            if (error) {
                showError(error);
            }
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        // Robot animation triggers
        function triggerHappy() {
            robotFace.classList.remove('speaking', 'thinking');
            robotFace.classList.add('happy');
            setTimeout(() => {
                robotFace.classList.remove('happy');
            }, 500);
        }

        function triggerSpeaking() {
            robotFace.classList.remove('happy', 'thinking');
            robotFace.classList.add('speaking');
        }

        function stopSpeaking() {
            robotFace.classList.remove('speaking');
        }

        // Start tour
        async function startTour() {
            try {
                errorMessage.style.display = 'none';

                // Initialize audio context (REQUIRED - must be from user interaction)
                initAudioContext();

                // Preload all audio files in the background for instant playback
                preloadAudioFiles().catch(err => {
                    console.warn('[Audio] Preload encountered errors, but continuing:', err);
                });

                // Trigger wake-up animation
                mainContainer.classList.add('waking-up');

                // Send POST request to start tour
                const response = await fetch(`${API_BASE}/tour/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({})
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to start tour');
                }

                const data = await response.json();
                console.log('Tour started with waypoints:', data.waypoints);

                // Update UI
                updateStatus('running');

                // Start polling for status
                pollStatus();

            } catch (error) {
                console.error('Error starting tour:', error);
                updateStatus('idle', null, error.message);
            }
        }

        // Poll tour status and handle audio playback
        async function pollStatus() {
            // Clear any existing interval
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
            }

            statusPollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/tour/status`);
                    const data = await response.json();

                    // Use 'introduction' as waypoint identifier when no waypoint is set
                    const currentWaypoint = data.current_waypoint || 'introduction';

                    // Check if we have a new script to play
                    if (data.script &&
                        (currentWaypoint !== lastWaypoint || data.script !== lastScript)) {

                        lastWaypoint = currentWaypoint;
                        lastScript = data.script;

                        console.log(`New waypoint: ${currentWaypoint}`);
                        console.log(`Script: ${data.script}`);

                        // Trigger speaking animation
                        triggerSpeaking();

                        // Play the pre-recorded audio and signal completion when done
                        await playAudio(currentWaypoint);
                        stopSpeaking();
                        await signalAudioComplete();
                    }

                    updateStatus(data.status, data.current_waypoint);

                    // Stop polling if tour is complete or failed
                    if (data.status === 'completed' || data.status === 'failed') {
                        clearInterval(statusPollInterval);
                        lastWaypoint = null;
                        lastScript = null;
                        stopSpeaking();
                        mouthAnimator.stop();

                        if (data.status === 'completed') {
                            console.log('Tour completed!');
                        }
                    }
                } catch (error) {
                    console.error('Error polling status:', error);
                }
            }, 500); // Poll every 500ms for responsiveness
        }

        // Check initial status on load
        async function checkInitialStatus() {
            try {
                const response = await fetch(`${API_BASE}/tour/status`);
                const data = await response.json();
                updateStatus(data.status, data.current_waypoint);

                // If tour is running, start polling
                if (data.status === 'running') {
                    // Initialize lastWaypoint to avoid re-announcing current waypoint
                    lastWaypoint = data.current_waypoint;
                    lastScript = data.script;
                    pollStatus();
                }
            } catch (error) {
                console.error('Error checking initial status:', error);
            }
        }

        // Event listeners
        startButton.addEventListener('click', startTour);

        // Initialize
        checkInitialStatus();

        // Start preloading audio files on page load (in background, non-blocking)
        window.addEventListener('load', () => {
            console.log('[Audio] Page loaded, starting background audio preload...');
            // Delay by 1 second to let page render first
            setTimeout(() => {
                preloadAudioFiles().catch(err => {
                    console.warn('[Audio] Background preload encountered errors:', err);
                });
            }, 1000);
        });

        // Random happy expressions when idle
        setInterval(() => {
            if (mainContainer.classList.contains('idle') && !isSpeaking) {
                triggerHappy();
            }
        }, 8000);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (mouthAnimationFrame) {
                cancelAnimationFrame(mouthAnimationFrame);
            }
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
            }
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (audioContext) {
                audioContext.close();
            }
        });
    </script>
</body>

</html>
