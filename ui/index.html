<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourBot Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .status-indicator {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .status-idle {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-running {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-completed {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status-failed {
            background: #ffebee;
            color: #d32f2f;
        }

        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            width: 100%;
            max-width: 300px;
        }

        .start-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .start-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .start-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .waypoint-info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 0.95em;
            color: #555;
        }

        .error-message {
            margin-top: 20px;
            padding: 15px;
            background: #ffebee;
            border-radius: 10px;
            color: #d32f2f;
            font-size: 0.95em;
        }

        .robot-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .running-animation {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="robot-icon">🤖</div>
        <h1>TourBot</h1>
        <p class="subtitle">Robotics Floor Tour Guide</p>

        <div id="status-indicator" class="status-indicator status-idle">Ready</div>

        <button id="start-button" class="start-button">
            Start Tour
        </button>

        <div id="waypoint-info" class="waypoint-info" style="display: none;">
            <strong>Current Waypoint:</strong> <span id="current-waypoint">-</span>
        </div>

        <div id="error-message" class="error-message" style="display: none;"></div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        const startButton = document.getElementById('start-button');
        const statusIndicator = document.getElementById('status-indicator');
        const waypointInfo = document.getElementById('waypoint-info');
        const currentWaypoint = document.getElementById('current-waypoint');
        const errorMessage = document.getElementById('error-message');
        const robotIcon = document.querySelector('.robot-icon');

        // Track current audio playback
        let currentUtterance = null;
        let lastWaypoint = null;
        let lastScript = null;

        // Speech synthesis function with completion callback
        function speak(text, onComplete) {
            return new Promise((resolve, reject) => {
                if (!('speechSynthesis' in window)) {
                    console.warn('Speech synthesis not supported');
                    resolve();
                    return;
                }

                // Cancel any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                utterance.onend = () => {
                    console.log('Speech finished');
                    currentUtterance = null;
                    if (onComplete) onComplete();
                    resolve();
                };

                utterance.onerror = (event) => {
                    console.error('Speech error:', event);
                    currentUtterance = null;
                    if (onComplete) onComplete();
                    resolve(); // Resolve anyway to not block the tour
                };

                currentUtterance = utterance;
                window.speechSynthesis.speak(utterance);
            });
        }

        // Signal to backend that audio is complete
        async function signalAudioComplete() {
            try {
                await fetch(`${API_BASE}/tour/audio-complete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                console.log('Signaled audio completion to backend');
            } catch (error) {
                console.error('Error signaling audio completion:', error);
            }
        }

        // Update UI based on tour status
        function updateStatus(status, waypoint = null, error = null) {
            // Update status indicator
            statusIndicator.className = 'status-indicator';
            robotIcon.classList.remove('running-animation');

            switch (status) {
                case 'idle':
                    statusIndicator.classList.add('status-idle');
                    statusIndicator.textContent = 'Ready';
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour';
                    waypointInfo.style.display = 'none';
                    break;
                case 'running':
                    statusIndicator.classList.add('status-running');
                    statusIndicator.textContent = 'Tour in Progress';
                    startButton.disabled = true;
                    startButton.textContent = 'Tour Running...';
                    robotIcon.classList.add('running-animation');
                    waypointInfo.style.display = 'block';
                    currentWaypoint.textContent = waypoint || 'Starting...';
                    break;
                case 'completed':
                    statusIndicator.classList.add('status-completed');
                    statusIndicator.textContent = 'Tour Completed';
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour';
                    waypointInfo.style.display = 'none';
                    break;
                case 'failed':
                    statusIndicator.classList.add('status-failed');
                    statusIndicator.textContent = 'Tour Failed';
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour';
                    waypointInfo.style.display = 'none';
                    break;
            }

            // Show/hide error message
            if (error) {
                errorMessage.textContent = error;
                errorMessage.style.display = 'block';
            } else {
                errorMessage.style.display = 'none';
            }
        }

        // Start tour (no waypoints needed - auto-discovered from backend)
        async function startTour() {
            try {
                errorMessage.style.display = 'none';

                // Send POST request to start tour (backend will auto-discover waypoints)
                const response = await fetch(`${API_BASE}/tour/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({})
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to start tour');
                }

                const data = await response.json();
                console.log('Tour started with waypoints:', data.waypoints);

                // Update UI
                updateStatus('running');

                // Start polling for status
                pollStatus();

            } catch (error) {
                console.error('Error starting tour:', error);
                updateStatus('idle', null, error.message);
            }
        }

        // Poll tour status and handle audio playback
        let statusPollInterval = null;

        async function pollStatus() {
            // Clear any existing interval
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
            }

            statusPollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/tour/status`);
                    const data = await response.json();

                    // Check if waypoint changed and we have a new script to play
                    if (data.current_waypoint &&
                        data.script &&
                        (data.current_waypoint !== lastWaypoint || data.script !== lastScript)) {

                        lastWaypoint = data.current_waypoint;
                        lastScript = data.script;

                        console.log(`New waypoint: ${data.current_waypoint}`);
                        console.log(`Script: ${data.script}`);

                        // Play the script audio and signal completion when done
                        await speak(data.script, signalAudioComplete);
                    }

                    updateStatus(data.status, data.current_waypoint);

                    // Stop polling if tour is complete or failed
                    if (data.status === 'completed' || data.status === 'failed') {
                        clearInterval(statusPollInterval);
                        lastWaypoint = null;
                        lastScript = null;

                        if (data.status === 'completed') {
                            console.log('Tour completed!');
                        }
                    }
                } catch (error) {
                    console.error('Error polling status:', error);
                }
            }, 500); // Poll every 500ms for responsiveness
        }

        // Check initial status on load
        async function checkInitialStatus() {
            try {
                const response = await fetch(`${API_BASE}/tour/status`);
                const data = await response.json();
                updateStatus(data.status, data.current_waypoint);

                // If tour is running, start polling
                if (data.status === 'running') {
                    // Initialize lastWaypoint to avoid re-announcing current waypoint
                    lastWaypoint = data.current_waypoint;
                    lastScript = data.script;
                    pollStatus();
                }
            } catch (error) {
                console.error('Error checking initial status:', error);
            }
        }

        // Event listeners
        startButton.addEventListener('click', startTour);

        // Initialize
        checkInitialStatus();
    </script>
</body>

</html>
