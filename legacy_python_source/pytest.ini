[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --cov=apps
    --cov=api
    --cov=adapters
    --cov=config
    --cov-report=html
    --cov-report=term-missing
markers =
    hardware: tests requiring the physical robot (run with RUN_HARDWARE_TESTS=1 pytest -m hardware)

