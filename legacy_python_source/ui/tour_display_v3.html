<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TourBot - Audio Reactive Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }

        .robot-container {
            position: relative;
            width: 500px;
            height: 560px;
            perspective: 1000px;
            transition: all 0.6s ease;
        }

        /* Idle state - blurred face */
        .idle .robot-container {
            filter: blur(12px);
            opacity: 0.25;
            transform: scale(0.95);
        }

        /* Running state - clear face */
        .tour-running .robot-container {
            filter: blur(0);
            opacity: 1;
            transform: scale(1);
        }

        .robot-face {
            position: relative;
            width: 100%;
            height: 100%;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* Robot head */
        .head {
            position: absolute;
            width: 375px;
            height: 400px;
            background: linear-gradient(145deg, #f0f0f0, #d4d4d4);
            border-radius: 75px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 2px 10px rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }

        /* Antenna */
        .antenna {
            position: absolute;
            width: 8px;
            height: 62px;
            background: linear-gradient(to bottom, #888, #666);
            left: 50%;
            top: -50px;
            transform: translateX(-50%);
            border-radius: 4px;
        }

        .antenna-ball {
            position: absolute;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #ee5a6f);
            border-radius: 50%;
            left: 50%;
            top: -62px;
            transform: translateX(-50%);
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
            }

            50% {
                transform: translateX(-50%) scale(1.2);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.9);
            }
        }

        /* Eyes container */
        .eyes {
            position: absolute;
            width: 300px;
            top: 125px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
        }

        .eye {
            position: relative;
            width: 100px;
            height: 125px;
            background: #2c3e50;
            border-radius: 50px;
            box-shadow:
                inset 0 5px 15px rgba(0, 0, 0, 0.5),
                0 2px 5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .pupil {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #4ecdc4, #2c9e96);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 0 40px rgba(78, 205, 196, 0.6),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
            animation: look-around 4s ease-in-out infinite;
        }

        @keyframes look-around {

            0%,
            100% {
                transform: translate(-50%, -50%);
            }

            25% {
                transform: translate(-30%, -50%);
            }

            50% {
                transform: translate(-50%, -40%);
            }

            75% {
                transform: translate(-70%, -50%);
            }
        }

        .pupil-shine {
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 10px;
            left: 12px;
            box-shadow: 5px 5px 10px rgba(255, 255, 255, 0.5);
        }

        /* Blinking animation */
        .eye::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2c3e50;
            top: -100%;
            left: 0;
            animation: blink 5s infinite;
            z-index: 10;
        }

        @keyframes blink {

            0%,
            48%,
            52%,
            100% {
                top: -100%;
            }

            49%,
            51% {
                top: 0;
            }
        }

        /* Cheeks */
        .cheeks {
            position: absolute;
            width: 100%;
            top: 175px;
            left: 0;
        }

        .cheek {
            position: absolute;
            width: 50px;
            height: 38px;
            background: radial-gradient(ellipse, rgba(255, 107, 107, 0.6), transparent);
            border-radius: 50%;
            animation: blush 3s ease-in-out infinite;
        }

        .cheek.left {
            left: 25px;
        }

        .cheek.right {
            right: 25px;
        }

        @keyframes blush {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        /* Mouth - Enhanced for audio reactivity */
        .mouth {
            position: absolute;
            width: 175px;
            height: 88px;
            left: 50%;
            bottom: 88px;
            transform: translateX(-50%);
            overflow: hidden;
        }

        .mouth-shape {
            position: absolute;
            width: 175px;
            height: 175px;
            border: 8px solid #2c3e50;
            border-radius: 50%;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            transition: height 0.05s ease-out, border-width 0.05s ease-out;
        }

        /* Default smile animation when not speaking */
        .mouth-shape.idle-animation {
            animation: smile 4s ease-in-out infinite;
        }

        @keyframes smile {

            0%,
            100% {
                height: 175px;
                border-color: #2c3e50;
            }

            50% {
                height: 200px;
                border-color: #34495e;
            }
        }

        /* Screen lines decoration */
        .screen-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(to right,
                    transparent,
                    rgba(255, 255, 255, 0.1),
                    transparent);
            width: 100%;
            animation: scan 3s linear infinite;
        }

        .screen-line:nth-child(1) {
            top: 20%;
            animation-delay: 0s;
        }

        .screen-line:nth-child(2) {
            top: 40%;
            animation-delay: 0.5s;
        }

        .screen-line:nth-child(3) {
            top: 60%;
            animation-delay: 1s;
        }

        .screen-line:nth-child(4) {
            top: 80%;
            animation-delay: 1.5s;
        }

        @keyframes scan {
            0% {
                transform: translateY(-10px);
                opacity: 0;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(10px);
                opacity: 0;
            }
        }

        /* Speaking mode - Enhanced with CSS fallback */
        .speaking .mouth-shape {
            /* CSS fallback animation in case JS doesn't work */
            animation: speaking-fallback 0.3s ease-in-out infinite;
        }

        @keyframes speaking-fallback {
            0%, 100% {
                height: 150px;
            }
            50% {
                height: 200px;
            }
        }

        .speaking .pupil {
            box-shadow:
                0 0 50px rgba(78, 205, 196, 0.9),
                0 0 25px rgba(78, 205, 196, 0.6),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
        }

        .speaking .antenna-ball {
            animation: pulse-speaking 0.6s ease-in-out infinite;
        }

        @keyframes pulse-speaking {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
            }

            50% {
                transform: translateX(-50%) scale(1.25);
                box-shadow: 0 0 45px rgba(255, 107, 107, 1);
            }
        }

        /* Happy mode */
        .happy .head {
            animation: wobble 0.5s ease-in-out;
        }

        @keyframes wobble {

            0%,
            100% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            25% {
                transform: translate(-50%, -50%) rotate(-5deg);
            }

            75% {
                transform: translate(-50%, -50%) rotate(5deg);
            }
        }

        /* Thinking mode */
        .thinking .antenna-ball {
            animation: thinking-pulse 1s ease-in-out infinite;
        }

        @keyframes thinking-pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                background: radial-gradient(circle at 30% 30%, #4ecdc4, #2c9e96);
            }

            50% {
                transform: translateX(-50%) scale(1.2);
                background: radial-gradient(circle at 30% 30%, #4ecdc4, #44d9ce);
            }
        }

        /* Start button - CENTERED when idle */
        .start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #764ba2;
            border: none;
            padding: 40px 100px;
            font-size: 3em;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-weight: 700;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 100;
            opacity: 1;
            pointer-events: auto;
        }

        .start-button:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: #f8f8f8;
        }

        .start-button:active:not(:disabled) {
            transform: translate(-50%, -50%) scale(0.98);
        }

        .start-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #e0e0e0;
        }

        /* Hide button when tour is running */
        .start-button.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.8);
        }

        /* Waypoint display */
        .waypoint-display {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.8em;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            backdrop-filter: blur(15px);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 50;
        }

        .tour-running .waypoint-display {
            opacity: 1;
        }

        .error-message {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(211, 47, 47, 0.95);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 200;
        }

        /* Running state animations */
        .tour-running .robot-face {
            animation: float 2s ease-in-out infinite;
        }

        .tour-running .antenna-ball {
            animation: pulse-fast 1s ease-in-out infinite;
        }

        @keyframes pulse-fast {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
            }

            50% {
                transform: translateX(-50%) scale(1.3);
                box-shadow: 0 0 50px rgba(255, 107, 107, 1);
            }
        }

        /* Wake-up animation */
        @keyframes wakeUp {
            0% {
                filter: blur(12px);
                opacity: 0.25;
                transform: scale(0.95);
            }
            100% {
                filter: blur(0);
                opacity: 1;
                transform: scale(1);
            }
        }

        .waking-up .robot-container {
            animation: wakeUp 0.8s ease-out forwards;
        }

        /* Audio indicator */
        .audio-indicator {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .audio-indicator.active {
            display: flex;
        }

        .audio-bars {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 30px;
        }

        .audio-bar {
            width: 4px;
            background: white;
            border-radius: 2px;
            animation: audio-pulse 0.6s ease-in-out infinite;
        }

        .audio-bar:nth-child(1) { animation-delay: 0s; }
        .audio-bar:nth-child(2) { animation-delay: 0.1s; }
        .audio-bar:nth-child(3) { animation-delay: 0.2s; }
        .audio-bar:nth-child(4) { animation-delay: 0.15s; }
        .audio-bar:nth-child(5) { animation-delay: 0.05s; }

        @keyframes audio-pulse {
            0%, 100% { height: 8px; }
            50% { height: 25px; }
        }
    </style>
</head>

<body>
    <div class="container idle" id="mainContainer">
        <div class="robot-container">
            <div class="robot-face" id="robotFace">
                <div class="head">
                    <div class="antenna"></div>
                    <div class="antenna-ball"></div>

                    <div class="eyes">
                        <div class="eye">
                            <div class="pupil">
                                <div class="pupil-shine"></div>
                            </div>
                        </div>
                        <div class="eye">
                            <div class="pupil">
                                <div class="pupil-shine"></div>
                            </div>
                        </div>
                    </div>

                    <div class="cheeks">
                        <div class="cheek left"></div>
                        <div class="cheek right"></div>
                    </div>

                    <div class="mouth">
                        <div class="mouth-shape idle-animation" id="mouthShape"></div>
                    </div>

                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                </div>
            </div>
        </div>

        <div id="waypoint-display" class="waypoint-display"></div>
    </div>

    <button id="start-button" class="start-button">Start Tour 👋</button>

    <div id="error-message" class="error-message"></div>

    <div id="audio-indicator" class="audio-indicator">
        <div class="audio-bars">
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
            <div class="audio-bar"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        const startButton = document.getElementById('start-button');
        const waypointDisplay = document.getElementById('waypoint-display');
        const errorMessage = document.getElementById('error-message');
        const robotFace = document.getElementById('robotFace');
        const mainContainer = document.getElementById('mainContainer');
        const mouthShape = document.getElementById('mouthShape');
        const audioIndicator = document.getElementById('audio-indicator');

        // Track current state
        let currentUtterance = null;
        let lastWaypoint = null;
        let lastScript = null;
        let statusPollInterval = null;
        let mouthAnimationFrame = null;
        let isSpeaking = false;
        let speechSynthReady = false;

        // Audio-reactive mouth animation
        class MouthAnimator {
            constructor(mouthElement) {
                this.mouth = mouthElement;
                this.isActive = false;
                this.targetHeight = 175;
                this.currentHeight = 175;
                this.smoothing = 0.3;
                this.wordTimings = [];
                this.startTime = 0;
            }

            start(text) {
                // Cancel any existing animation
                if (mouthAnimationFrame) {
                    cancelAnimationFrame(mouthAnimationFrame);
                    mouthAnimationFrame = null;
                }
                
                this.isActive = true;
                this.mouth.classList.remove('idle-animation');
                this.startTime = Date.now();
                
                // Analyze text to create realistic mouth movements
                this.wordTimings = this.analyzeText(text);
                this.animate();
            }

            stop() {
                this.isActive = false;
                
                // Cancel animation frame
                if (mouthAnimationFrame) {
                    cancelAnimationFrame(mouthAnimationFrame);
                    mouthAnimationFrame = null;
                }
                
                this.mouth.classList.add('idle-animation');
                this.currentHeight = 175;
                // Clear inline styles to let CSS animations work
                this.mouth.style.height = '';
                this.mouth.style.borderWidth = '';
            }

            analyzeText(text) {
                // Split text into words and estimate timing
                const words = text.split(/\s+/);
                const timings = [];
                let currentTime = 0;
                
                words.forEach(word => {
                    // Estimate duration based on syllables (rough approximation)
                    const syllables = this.countSyllables(word);
                    const duration = syllables * 200; // ~200ms per syllable
                    
                    timings.push({
                        start: currentTime,
                        end: currentTime + duration,
                        intensity: Math.min(1, syllables / 3) // More syllables = more mouth movement
                    });
                    
                    currentTime += duration + 100; // Add small pause between words
                });
                
                return timings;
            }

            countSyllables(word) {
                // Simple syllable counter
                word = word.toLowerCase();
                if (word.length <= 3) return 1;
                word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
                word = word.replace(/^y/, '');
                const syllables = word.match(/[aeiouy]{1,2}/g);
                return syllables ? syllables.length : 1;
            }

            animate() {
                if (!this.isActive) return;

                const elapsed = Date.now() - this.startTime;
                
                // Find current word timing
                const currentWord = this.wordTimings.find(
                    w => elapsed >= w.start && elapsed <= w.end
                );

                if (currentWord) {
                    // Calculate mouth opening based on word intensity
                    const progress = (elapsed - currentWord.start) / (currentWord.end - currentWord.start);
                    
                    // Create realistic open-close pattern within each word
                    let openAmount;
                    if (progress < 0.3) {
                        // Opening
                        openAmount = progress / 0.3;
                    } else if (progress < 0.7) {
                        // Sustain
                        openAmount = 0.8 + Math.sin(progress * 20) * 0.2;
                    } else {
                        // Closing
                        openAmount = (1 - progress) / 0.3;
                    }

                    this.targetHeight = 175 + (openAmount * currentWord.intensity * 150);
                } else {
                    // Between words - slightly open
                    this.targetHeight = 175 + (Math.sin(elapsed * 0.01) * 20);
                }

                // Add random micro-movements for realism
                this.targetHeight += (Math.random() - 0.5) * 10;

                // Smooth interpolation
                this.currentHeight += (this.targetHeight - this.currentHeight) * this.smoothing;

                // Apply to mouth
                this.mouth.style.height = `${this.currentHeight}px`;
                
                // Adjust border width slightly for more expression
                const borderWidth = 8 + (this.currentHeight - 175) * 0.02;
                this.mouth.style.borderWidth = `${borderWidth}px`;

                // Continue animation
                mouthAnimationFrame = requestAnimationFrame(() => this.animate());
            }
        }

        const mouthAnimator = new MouthAnimator(mouthShape);

        // Initialize speech synthesis (required for mobile browsers)
        function initSpeechSynthesis() {
            if (!('speechSynthesis' in window)) {
                console.warn('Speech synthesis not supported');
                return false;
            }

            try {
                // Force load voices (required on some mobile browsers)
                const voices = window.speechSynthesis.getVoices();
                console.log(`Loaded ${voices.length} voices`);

                // Mobile browsers require speech to be triggered from user interaction
                // Speak a silent utterance to "warm up" the API
                const utterance = new SpeechSynthesisUtterance('');
                utterance.volume = 0;
                window.speechSynthesis.speak(utterance);
                
                speechSynthReady = true;
                console.log('Speech synthesis initialized for mobile');
                return true;
            } catch (error) {
                console.error('Failed to initialize speech synthesis:', error);
                return false;
            }
        }

        // Speech synthesis function with audio-reactive mouth
        function speak(text) {
            return new Promise((resolve, reject) => {
                if (!('speechSynthesis' in window)) {
                    console.warn('Speech synthesis not supported');
                    resolve();
                    return;
                }

                console.log(`[Speech] Speaking: "${text.substring(0, 50)}..."`);
                console.log(`[Speech] Ready state: ${speechSynthReady}`);
                console.log(`[Speech] Pending: ${window.speechSynthesis.pending}`);
                console.log(`[Speech] Speaking: ${window.speechSynthesis.speaking}`);

                // Cancel any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                // Try to use a specific voice (helps on some devices)
                const voices = window.speechSynthesis.getVoices();
                if (voices.length > 0) {
                    utterance.voice = voices[0];
                    console.log(`[Speech] Using voice: ${voices[0].name}`);
                }

                // Start mouth animation immediately (don't wait for onstart)
                console.log('[Speech] Starting mouth animation');
                isSpeaking = true;
                audioIndicator.classList.add('active');
                mouthAnimator.start(text);

                utterance.onstart = () => {
                    console.log('[Speech] Utterance started');
                };

                utterance.onend = () => {
                    console.log('[Speech] Utterance finished');
                    currentUtterance = null;
                    isSpeaking = false;
                    audioIndicator.classList.remove('active');
                    mouthAnimator.stop();
                    resolve();
                };

                utterance.onerror = (event) => {
                    console.error('[Speech] Error:', event.error, event);
                    currentUtterance = null;
                    isSpeaking = false;
                    audioIndicator.classList.remove('active');
                    mouthAnimator.stop();
                    resolve(); // Resolve anyway to not block the tour
                };

                currentUtterance = utterance;
                console.log('[Speech] Calling speechSynthesis.speak()');
                window.speechSynthesis.speak(utterance);
                console.log('[Speech] speak() called successfully');
            });
        }

        // Signal to backend that audio is complete
        async function signalAudioComplete() {
            try {
                await fetch(`${API_BASE}/tour/audio-complete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                console.log('Signaled audio completion to backend');
            } catch (error) {
                console.error('Error signaling audio completion:', error);
            }
        }

        // Update UI based on tour status
        function updateStatus(status, waypoint = null, error = null) {
            // Reset robot modes
            robotFace.classList.remove('happy', 'speaking', 'thinking');

            switch (status) {
                case 'idle':
                    mainContainer.classList.remove('tour-running', 'waking-up');
                    mainContainer.classList.add('idle');
                    startButton.classList.remove('hidden');
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour 👋';
                    break;

                case 'running':
                    startButton.classList.add('hidden');
                    startButton.disabled = true;
                    mainContainer.classList.remove('idle');
                    mainContainer.classList.add('tour-running');

                    if (waypoint) {
                        waypointDisplay.textContent = `📍 ${waypoint}`;
                    }
                    break;

                case 'completed':
                    mainContainer.classList.remove('tour-running', 'waking-up');
                    mainContainer.classList.add('idle');
                    startButton.classList.remove('hidden');
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour 👋';
                    triggerHappy();
                    break;

                case 'failed':
                    mainContainer.classList.remove('tour-running', 'waking-up');
                    mainContainer.classList.add('idle');
                    startButton.classList.remove('hidden');
                    startButton.disabled = false;
                    startButton.textContent = 'Start Tour 👋';
                    break;
            }

            // Show/hide error message
            if (error) {
                errorMessage.textContent = error;
                errorMessage.style.display = 'block';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }
        }

        // Robot animation triggers
        function triggerHappy() {
            robotFace.classList.remove('speaking', 'thinking');
            robotFace.classList.add('happy');
            setTimeout(() => {
                robotFace.classList.remove('happy');
            }, 500);
        }

        function triggerSpeaking() {
            robotFace.classList.remove('happy', 'thinking');
            robotFace.classList.add('speaking');
        }

        function stopSpeaking() {
            robotFace.classList.remove('speaking');
        }

        // Start tour
        async function startTour() {
            try {
                errorMessage.style.display = 'none';

                // Initialize speech synthesis (CRITICAL for mobile browsers)
                // Must be called directly from user interaction
                initSpeechSynthesis();

                // Trigger wake-up animation
                mainContainer.classList.add('waking-up');

                // Send POST request to start tour
                const response = await fetch(`${API_BASE}/tour/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({})
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to start tour');
                }

                const data = await response.json();
                console.log('Tour started with waypoints:', data.waypoints);

                // Update UI
                updateStatus('running');

                // Start polling for status
                pollStatus();

            } catch (error) {
                console.error('Error starting tour:', error);
                updateStatus('idle', null, error.message);
            }
        }

        // Poll tour status and handle audio playback
        async function pollStatus() {
            // Clear any existing interval
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
            }

            statusPollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/tour/status`);
                    const data = await response.json();

                    // Use 'introduction' as waypoint identifier when no waypoint is set
                    const currentWaypoint = data.current_waypoint || 'introduction';

                    // Check if we have a new script to play
                    if (data.script &&
                        (currentWaypoint !== lastWaypoint || data.script !== lastScript)) {

                        lastWaypoint = currentWaypoint;
                        lastScript = data.script;

                        console.log(`New waypoint: ${currentWaypoint}`);
                        console.log(`Script: ${data.script}`);

                        // Trigger speaking animation
                        triggerSpeaking();

                        // Play the script audio and signal completion when done
                        await speak(data.script);
                        stopSpeaking();
                        await signalAudioComplete();
                    }

                    updateStatus(data.status, data.current_waypoint);

                    // Stop polling if tour is complete or failed
                    if (data.status === 'completed' || data.status === 'failed') {
                        clearInterval(statusPollInterval);
                        lastWaypoint = null;
                        lastScript = null;
                        stopSpeaking();
                        mouthAnimator.stop();

                        if (data.status === 'completed') {
                            console.log('Tour completed!');
                        }
                    }
                } catch (error) {
                    console.error('Error polling status:', error);
                }
            }, 500); // Poll every 500ms for responsiveness
        }

        // Check initial status on load
        async function checkInitialStatus() {
            try {
                const response = await fetch(`${API_BASE}/tour/status`);
                const data = await response.json();
                updateStatus(data.status, data.current_waypoint);

                // If tour is running, start polling
                if (data.status === 'running') {
                    // Initialize lastWaypoint to avoid re-announcing current waypoint
                    lastWaypoint = data.current_waypoint;
                    lastScript = data.script;
                    pollStatus();
                }
            } catch (error) {
                console.error('Error checking initial status:', error);
            }
        }

        // Event listeners
        startButton.addEventListener('click', startTour);

        // Load voices (important for mobile browsers)
        if ('speechSynthesis' in window) {
            // Some browsers load voices asynchronously
            window.speechSynthesis.onvoiceschanged = () => {
                const voices = window.speechSynthesis.getVoices();
                console.log(`Voices loaded: ${voices.length} available`);
            };
            
            // Try to load voices immediately
            window.speechSynthesis.getVoices();
        }

        // Initialize
        checkInitialStatus();

        // Random happy expressions when idle
        setInterval(() => {
            if (mainContainer.classList.contains('idle') && !isSpeaking) {
                triggerHappy();
            }
        }, 8000);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (mouthAnimationFrame) {
                cancelAnimationFrame(mouthAnimationFrame);
            }
            if (statusPollInterval) {
                clearInterval(statusPollInterval);
            }
            window.speechSynthesis.cancel();
        });
    </script>
</body>

</html>
