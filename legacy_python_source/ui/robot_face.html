<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourBot Face - Animated Robot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            text-align: center;
        }


        .robot-container {
            position: relative;
            width: 700px;
            height: 800px;
            perspective: 1000px;
        }

        .robot-face {
            position: relative;
            width: 100%;
            height: 100%;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* Robot head */
        .head {
            position: absolute;
            width: 600px;
            height: 640px;
            background: linear-gradient(145deg, #f0f0f0, #d4d4d4);
            border-radius: 120px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 2px 10px rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }

        /* Antenna */
        .antenna {
            position: absolute;
            width: 12px;
            height: 100px;
            background: linear-gradient(to bottom, #888, #666);
            left: 50%;
            top: -80px;
            transform: translateX(-50%);
            border-radius: 6px;
        }

        .antenna-ball {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #ee5a6f);
            border-radius: 50%;
            left: 50%;
            top: -100px;
            transform: translateX(-50%);
            box-shadow: 0 0 40px rgba(255, 107, 107, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
            }

            50% {
                transform: translateX(-50%) scale(1.2);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.9);
            }
        }

        /* Eyes container */
        .eyes {
            position: absolute;
            width: 480px;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
        }

        .eye {
            position: relative;
            width: 160px;
            height: 200px;
            background: #2c3e50;
            border-radius: 80px;
            box-shadow:
                inset 0 5px 15px rgba(0, 0, 0, 0.5),
                0 2px 5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .pupil {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #4ecdc4, #2c9e96);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 0 40px rgba(78, 205, 196, 0.6),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
            animation: look-around 4s ease-in-out infinite;
        }

        @keyframes look-around {

            0%,
            100% {
                transform: translate(-50%, -50%);
            }

            25% {
                transform: translate(-30%, -50%);
            }

            50% {
                transform: translate(-50%, -40%);
            }

            75% {
                transform: translate(-70%, -50%);
            }
        }

        .pupil-shine {
            position: absolute;
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
            top: 16px;
            left: 20px;
            box-shadow: 5px 5px 10px rgba(255, 255, 255, 0.5);
        }

        /* Blinking animation */
        .eye::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2c3e50;
            top: -100%;
            left: 0;
            animation: blink 5s infinite;
            z-index: 10;
        }

        @keyframes blink {

            0%,
            48%,
            52%,
            100% {
                top: -100%;
            }

            49%,
            51% {
                top: 0;
            }
        }

        /* Cheeks */
        .cheeks {
            position: absolute;
            width: 100%;
            top: 280px;
            left: 0;
        }

        .cheek {
            position: absolute;
            width: 80px;
            height: 60px;
            background: radial-gradient(ellipse, rgba(255, 107, 107, 0.6), transparent);
            border-radius: 50%;
            animation: blush 3s ease-in-out infinite;
        }

        .cheek.left {
            left: 40px;
        }

        .cheek.right {
            right: 40px;
        }

        @keyframes blush {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        /* Mouth */
        .mouth {
            position: absolute;
            width: 280px;
            height: 140px;
            left: 50%;
            bottom: 140px;
            transform: translateX(-50%);
            overflow: hidden;
        }

        .mouth-shape {
            position: absolute;
            width: 280px;
            height: 280px;
            border: 12px solid #2c3e50;
            border-radius: 50%;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: smile 4s ease-in-out infinite;
        }

        @keyframes smile {

            0%,
            100% {
                height: 280px;
                border-color: #2c3e50;
            }

            50% {
                height: 320px;
                border-color: #34495e;
            }
        }

        /* Screen lines decoration */
        .screen-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(to right,
                    transparent,
                    rgba(255, 255, 255, 0.1),
                    transparent);
            width: 100%;
            animation: scan 3s linear infinite;
        }

        .screen-line:nth-child(1) {
            top: 20%;
            animation-delay: 0s;
        }

        .screen-line:nth-child(2) {
            top: 40%;
            animation-delay: 0.5s;
        }

        .screen-line:nth-child(3) {
            top: 60%;
            animation-delay: 1s;
        }

        .screen-line:nth-child(4) {
            top: 80%;
            animation-delay: 1.5s;
        }

        @keyframes scan {
            0% {
                transform: translateY(-10px);
                opacity: 0;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(10px);
                opacity: 0;
            }
        }


        /* Speaking mode */
        .speaking .mouth-shape {
            animation: speaking 0.3s ease-in-out infinite;
        }

        @keyframes speaking {

            0%,
            100% {
                height: 240px;
            }

            50% {
                height: 320px;
            }
        }

        /* Happy mode */
        .happy .head {
            animation: wobble 0.5s ease-in-out;
        }

        @keyframes wobble {

            0%,
            100% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            25% {
                transform: translate(-50%, -50%) rotate(-5deg);
            }

            75% {
                transform: translate(-50%, -50%) rotate(5deg);
            }
        }

        /* Thinking mode */
        .thinking .antenna-ball {
            animation: thinking-pulse 1s ease-in-out infinite;
        }

        @keyframes thinking-pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
                background: radial-gradient(circle at 30% 30%, #4ecdc4, #2c9e96);
            }

            50% {
                transform: translateX(-50%) scale(1.2);
                background: radial-gradient(circle at 30% 30%, #4ecdc4, #44d9ce);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="robot-container">
            <div class="robot-face" id="robotFace">
                <div class="head">
                    <div class="antenna"></div>
                    <div class="antenna-ball"></div>

                    <div class="eyes">
                        <div class="eye">
                            <div class="pupil">
                                <div class="pupil-shine"></div>
                            </div>
                        </div>
                        <div class="eye">
                            <div class="pupil">
                                <div class="pupil-shine"></div>
                            </div>
                        </div>
                    </div>

                    <div class="cheeks">
                        <div class="cheek left"></div>
                        <div class="cheek right"></div>
                    </div>

                    <div class="mouth">
                        <div class="mouth-shape"></div>
                    </div>

                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                    <div class="screen-line"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const robotFace = document.getElementById('robotFace');
        let currentMode = null;

        function triggerHappy() {
            resetMode();
            robotFace.classList.add('happy');
            currentMode = 'happy';
            setTimeout(() => {
                if (currentMode === 'happy') {
                    robotFace.classList.remove('happy');
                    currentMode = null;
                }
            }, 500);
        }

        function triggerSpeaking() {
            resetMode();
            robotFace.classList.add('speaking');
            currentMode = 'speaking';
        }

        function triggerThinking() {
            resetMode();
            robotFace.classList.add('thinking');
            currentMode = 'thinking';
        }

        function resetMode() {
            robotFace.classList.remove('happy', 'speaking', 'thinking');
            currentMode = null;
        }

        // Random happy expressions
        setInterval(() => {
            if (!currentMode) {
                triggerHappy();
            }
        }, 8000);
    </script>
</body>

</html>
