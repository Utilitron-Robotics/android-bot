AWSTemplateFormatVersion: '2010-09-09'
Description: 'Frontier Tower - Robot Fleet Management Backend'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  ApiDomainName:
    Type: String
    Default: ''
    Description: Custom domain name (optional)

Resources:
  # DynamoDB Tables
  RobotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'frontiertower-robots-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: robot_id
          AttributeType: S
        - AttributeName: building
          AttributeType: S
      KeySchema:
        - AttributeName: robot_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-building
          KeySchema:
            - AttributeName: building
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  CommandsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'frontiertower-commands-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: robot_id
          AttributeType: S
        - AttributeName: command_id
          AttributeType: S
      KeySchema:
        - AttributeName: robot_id
          KeyType: HASH
        - AttributeName: command_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'frontiertower-alerts-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: robot_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: robot_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Fleet-wide configuration (shared across ALL robots)
  FleetConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'frontiertower-fleet-config-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: config_key
          AttributeType: S
      KeySchema:
        - AttributeName: config_key
          KeyType: HASH

  # Floors table - physical floors in buildings
  FloorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'frontiertower-floors-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: floor_id
          AttributeType: S
        - AttributeName: building
          AttributeType: S
      KeySchema:
        - AttributeName: floor_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-building
          KeySchema:
            - AttributeName: building
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Maps table - SLAM maps belong to floors, shared by robots
  MapsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'frontiertower-maps-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: map_id
          AttributeType: S
        - AttributeName: floor_id
          AttributeType: S
      KeySchema:
        - AttributeName: map_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-floor
          KeySchema:
            - AttributeName: floor_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Tours table - tours belong to maps, shared by all robots on that map
  ToursTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'frontiertower-tours-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tour_id
          AttributeType: S
        - AttributeName: map_id
          AttributeType: S
      KeySchema:
        - AttributeName: tour_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-map
          KeySchema:
            - AttributeName: map_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Lambda Execution Role
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'frontiertower-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt RobotsTable.Arn
                  - !Sub '${RobotsTable.Arn}/index/*'
                  - !GetAtt CommandsTable.Arn
                  - !GetAtt AlertsTable.Arn
                  - !GetAtt FleetConfigTable.Arn
                  - !GetAtt FloorsTable.Arn
                  - !Sub '${FloorsTable.Arn}/index/*'
                  - !GetAtt MapsTable.Arn
                  - !Sub '${MapsTable.Arn}/index/*'
                  - !GetAtt ToursTable.Arn
                  - !Sub '${ToursTable.Arn}/index/*'

  # API Lambda Functions
  FleetApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'frontiertower-fleet-api-${Environment}'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ROBOTS_TABLE: !Ref RobotsTable
          COMMANDS_TABLE: !Ref CommandsTable
          ALERTS_TABLE: !Ref AlertsTable
          FLEET_CONFIG_TABLE: !Ref FleetConfigTable
          FLOORS_TABLE: !Ref FloorsTable
          MAPS_TABLE: !Ref MapsTable
          TOURS_TABLE: !Ref ToursTable
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import time
          import uuid
          from decimal import Decimal

          dynamodb = boto3.resource('dynamodb')
          robots_table = dynamodb.Table(os.environ['ROBOTS_TABLE'])
          commands_table = dynamodb.Table(os.environ['COMMANDS_TABLE'])
          alerts_table = dynamodb.Table(os.environ['ALERTS_TABLE'])
          config_table = dynamodb.Table(os.environ['FLEET_CONFIG_TABLE'])
          floors_table = dynamodb.Table(os.environ['FLOORS_TABLE'])
          maps_table = dynamodb.Table(os.environ['MAPS_TABLE'])
          tours_table = dynamodb.Table(os.environ['TOURS_TABLE'])

          def decimal_default(obj):
              if isinstance(obj, Decimal):
                  return float(obj)
              raise TypeError

          def convert_floats(obj):
              """Convert floats to Decimal for DynamoDB"""
              if isinstance(obj, float):
                  return Decimal(str(obj))
              elif isinstance(obj, dict):
                  return {k: convert_floats(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [convert_floats(i) for i in obj]
              return obj

          def handler(event, context):
              method = event.get('httpMethod', event.get('requestContext', {}).get('http', {}).get('method'))
              path = event.get('path', event.get('rawPath', ''))
              # Strip stage prefix from API Gateway HTTP API v2 paths (e.g., /dev/fleet/config -> /fleet/config)
              if path.startswith('/dev/') or path.startswith('/staging/') or path.startswith('/prod/'):
                  path = path.split('/', 2)[2] if path.count('/') >= 2 else path
                  path = '/' + path
              body = json.loads(event.get('body', '{}') or '{}')

              # Handle CORS preflight OPTIONS requests
              if method == 'OPTIONS':
                  return response(200, {})

              # Route requests
              if path == '/fleet/register' and method == 'POST':
                  return register_robot(body)
              elif path == '/fleet/deregister' and method == 'POST':
                  return deregister_robot(body)
              elif path == '/fleet/status' and method in ['GET', 'POST']:
                  if method == 'POST':
                      return update_status(body)
                  return get_fleet_status()
              elif path.startswith('/fleet/commands') and method == 'GET':
                  robot_id = path.split('/')[-1]
                  return get_commands(robot_id)
              elif path == '/fleet/commands' and method == 'POST':
                  return send_command(body)
              elif path == '/fleet/commands/ack' and method == 'POST':
                  return ack_command(body)
              elif path == '/fleet/commands/complete' and method == 'POST':
                  return complete_command(body)
              elif path == '/fleet/alerts' and method in ['GET', 'POST']:
                  if method == 'POST':
                      return create_alert(body)
                  return get_alerts(event.get('queryStringParameters', {}))
              # Fleet-wide config (shared by ALL robots)
              elif path == '/fleet/config' and method == 'GET':
                  return get_fleet_config()
              elif path == '/fleet/config' and method == 'POST':
                  return update_fleet_config(body)
              elif path.startswith('/fleet/config/') and method == 'GET':
                  key = path.split('/')[-1]
                  return get_config_key(key)
              elif path.startswith('/fleet/config/') and method == 'POST':
                  key = path.split('/')[-1]
                  return set_config_key(key, body)
              # Floors API
              elif path == '/floors' and method == 'GET':
                  return get_floors(event.get('queryStringParameters', {}))
              elif path == '/floors' and method == 'POST':
                  return create_floor(body)
              elif path.startswith('/floors/') and method == 'GET':
                  floor_id = path.split('/')[-1]
                  return get_floor(floor_id)
              elif path.startswith('/floors/') and method == 'DELETE':
                  floor_id = path.split('/')[-1]
                  return delete_floor(floor_id)
              # Maps API
              elif path == '/maps' and method == 'GET':
                  return get_maps(event.get('queryStringParameters', {}))
              elif path == '/maps' and method == 'POST':
                  return create_map(body)
              elif path.startswith('/maps/') and method == 'GET':
                  map_id = path.split('/')[-1]
                  return get_map(map_id)
              elif path.startswith('/maps/') and method == 'PUT':
                  map_id = path.split('/')[-1]
                  return update_map(map_id, body)
              elif path.startswith('/maps/') and method == 'DELETE':
                  map_id = path.split('/')[-1]
                  return delete_map(map_id)
              # Tours API - shared by all robots on a map
              elif path == '/tours' and method == 'GET':
                  return get_tours(event.get('queryStringParameters', {}))
              elif path == '/tours' and method == 'POST':
                  return create_tour(body)
              elif path.startswith('/tours/') and method == 'GET':
                  tour_id = path.split('/')[-1]
                  return get_tour(tour_id)
              elif path.startswith('/tours/') and method == 'PUT':
                  tour_id = path.split('/')[-1]
                  return update_tour(tour_id, body)
              elif path.startswith('/tours/') and method == 'DELETE':
                  tour_id = path.split('/')[-1]
                  return delete_tour(tour_id)

              return response(404, {'error': 'Not found'})

          def register_robot(body):
              robot_id = body.get('robot_id')
              if not robot_id:
                  return response(400, {'error': 'robot_id required'})

              robots_table.put_item(Item={
                  'robot_id': robot_id,
                  'tablet_model': body.get('tablet_model', 'unknown'),
                  'android_version': body.get('android_version', 0),
                  'app_version': body.get('app_version', '1.0.0'),
                  'capabilities': body.get('capabilities', {}),
                  'registered_at': int(time.time() * 1000),
                  'online': True,
                  'last_seen': int(time.time() * 1000),
              })
              return response(200, {'status': 'registered', 'robot_id': robot_id})

          def deregister_robot(body):
              robot_id = body.get('robot_id')
              if robot_id:
                  robots_table.update_item(
                      Key={'robot_id': robot_id},
                      UpdateExpression='SET online = :o, last_seen = :t',
                      ExpressionAttributeValues={':o': False, ':t': int(time.time() * 1000)}
                  )
              return response(200, {'status': 'deregistered'})

          def update_status(body):
              robot_id = body.get('robot_id')
              if not robot_id:
                  return response(400, {'error': 'robot_id required'})

              robots_table.update_item(
                  Key={'robot_id': robot_id},
                  UpdateExpression='SET battery = :b, #pos = :p, nav_status = :n, current_goal = :g, estop = :e, online = :o, building = :bld, floor = :f, last_seen = :t',
                  ExpressionAttributeNames={'#pos': 'position'},
                  ExpressionAttributeValues={
                      ':b': body.get('battery', 0),
                      ':p': body.get('position', {'x': 0, 'y': 0, 'theta': 0}),
                      ':n': body.get('nav_status', 0),
                      ':g': body.get('current_goal'),
                      ':e': body.get('estop', False),
                      ':o': body.get('online', True),
                      ':bld': body.get('building'),
                      ':f': body.get('floor'),
                      ':t': body.get('timestamp', int(time.time() * 1000)),
                  }
              )
              return response(200, {'status': 'updated'})

          def get_fleet_status():
              result = robots_table.scan()
              robots = result.get('Items', [])
              return response(200, {'robots': robots})

          def send_command(body):
              robot_id = body.get('robot_id')
              cmd_type = body.get('type')
              if not robot_id or not cmd_type:
                  return response(400, {'error': 'robot_id and type required'})

              command_id = str(uuid.uuid4())
              ttl = int(time.time()) + 300  # 5 minute TTL

              commands_table.put_item(Item={
                  'robot_id': robot_id,
                  'command_id': command_id,
                  'type': cmd_type,
                  'payload': body.get('payload', {}),
                  'status': 'pending',
                  'timestamp': int(time.time() * 1000),
                  'ttl': ttl,
              })
              return response(200, {'status': 'sent', 'command_id': command_id})

          def get_commands(robot_id):
              result = commands_table.query(
                  KeyConditionExpression='robot_id = :r',
                  FilterExpression='#s = :p',
                  ExpressionAttributeNames={'#s': 'status'},
                  ExpressionAttributeValues={':r': robot_id, ':p': 'pending'}
              )
              return response(200, {'commands': result.get('Items', [])})

          def ack_command(body):
              robot_id = body.get('robot_id')
              command_id = body.get('command_id')
              if robot_id and command_id:
                  commands_table.update_item(
                      Key={'robot_id': robot_id, 'command_id': command_id},
                      UpdateExpression='SET #s = :s',
                      ExpressionAttributeNames={'#s': 'status'},
                      ExpressionAttributeValues={':s': 'received'}
                  )
              return response(200, {'status': 'acknowledged'})

          def complete_command(body):
              robot_id = body.get('robot_id')
              command_id = body.get('command_id')
              if robot_id and command_id:
                  commands_table.update_item(
                      Key={'robot_id': robot_id, 'command_id': command_id},
                      UpdateExpression='SET #s = :s, message = :m',
                      ExpressionAttributeNames={'#s': 'status'},
                      ExpressionAttributeValues={
                          ':s': body.get('status', 'completed'),
                          ':m': body.get('message')
                      }
                  )
              return response(200, {'status': 'completed'})

          def create_alert(body):
              robot_id = body.get('robot_id')
              if not robot_id:
                  return response(400, {'error': 'robot_id required'})

              timestamp = body.get('timestamp', int(time.time() * 1000))
              ttl = int(time.time()) + 86400 * 7  # 7 day TTL

              alerts_table.put_item(Item={
                  'robot_id': robot_id,
                  'timestamp': timestamp,
                  'alert_type': body.get('alert_type', 'info'),
                  'message': body.get('message', ''),
                  'severity': body.get('severity', 'info'),
                  'ttl': ttl,
              })
              return response(200, {'status': 'created'})

          def get_alerts(params):
              limit = int(params.get('limit', 50)) if params else 50
              result = alerts_table.scan(Limit=limit)
              alerts = sorted(result.get('Items', []), key=lambda x: x.get('timestamp', 0), reverse=True)
              return response(200, {'alerts': alerts})

          # Fleet config functions - ONE config for ALL robots
          def get_fleet_config():
              result = config_table.scan()
              items = result.get('Items', [])
              config = {item['config_key']: item.get('value') for item in items}
              return response(200, config)

          def update_fleet_config(body):
              # body is a dict of key-value pairs to set
              for key, value in body.items():
                  config_table.put_item(Item={
                      'config_key': key,
                      'value': convert_floats(value),
                      'updated_at': int(time.time() * 1000)
                  })
              return response(200, {'status': 'updated', 'keys': list(body.keys())})

          def get_config_key(key):
              result = config_table.get_item(Key={'config_key': key})
              item = result.get('Item')
              if item:
                  return response(200, {'key': key, 'value': item.get('value')})
              return response(404, {'error': f'Config key {key} not found'})

          def set_config_key(key, body):
              value = body.get('value', body)  # Accept {"value": X} or just X
              config_table.put_item(Item={
                  'config_key': key,
                  'value': convert_floats(value),
                  'updated_at': int(time.time() * 1000)
              })
              return response(200, {'status': 'set', 'key': key})

          # Floors functions
          def get_floors(params):
              building = params.get('building') if params else None
              if building:
                  result = floors_table.query(
                      IndexName='by-building',
                      KeyConditionExpression='building = :b',
                      ExpressionAttributeValues={':b': building}
                  )
              else:
                  result = floors_table.scan()
              return response(200, {'floors': result.get('Items', [])})

          def create_floor(body):
              floor_id = body.get('floor_id') or str(uuid.uuid4())
              floors_table.put_item(Item={
                  'floor_id': floor_id,
                  'name': body.get('name', ''),
                  'building': body.get('building', ''),
                  'level_number': body.get('level_number', 0),
                  'created_at': int(time.time() * 1000)
              })
              return response(200, {'status': 'created', 'floor_id': floor_id})

          def get_floor(floor_id):
              result = floors_table.get_item(Key={'floor_id': floor_id})
              item = result.get('Item')
              if item:
                  return response(200, item)
              return response(404, {'error': 'Floor not found'})

          def delete_floor(floor_id):
              floors_table.delete_item(Key={'floor_id': floor_id})
              return response(200, {'status': 'deleted'})

          # Maps functions
          def get_maps(params):
              floor_id = params.get('floor_id') if params else None
              if floor_id:
                  result = maps_table.query(
                      IndexName='by-floor',
                      KeyConditionExpression='floor_id = :f',
                      ExpressionAttributeValues={':f': floor_id}
                  )
              else:
                  result = maps_table.scan()
              return response(200, {'maps': result.get('Items', [])})

          def create_map(body):
              map_id = body.get('map_id') or str(uuid.uuid4())
              maps_table.put_item(Item=convert_floats({
                  'map_id': map_id,
                  'name': body.get('name', ''),
                  'floor_id': body.get('floor_id', ''),
                  'resolution': body.get('resolution', 0.05),
                  'origin_x': body.get('origin_x', 0),
                  'origin_y': body.get('origin_y', 0),
                  'width': body.get('width', 0),
                  'height': body.get('height', 0),
                  'waypoints': body.get('waypoints', []),
                  'created_at': int(time.time() * 1000)
              }))
              return response(200, {'status': 'created', 'map_id': map_id})

          def get_map(map_id):
              result = maps_table.get_item(Key={'map_id': map_id})
              item = result.get('Item')
              if item:
                  return response(200, item)
              return response(404, {'error': 'Map not found'})

          def update_map(map_id, body):
              update_expr = 'SET updated_at = :t'
              expr_values = {':t': int(time.time() * 1000)}
              for key in ['name', 'waypoints', 'resolution', 'origin_x', 'origin_y', 'width', 'height']:
                  if key in body:
                      update_expr += f', {key} = :{key[0]}'
                      expr_values[f':{key[0]}'] = convert_floats(body[key])
              maps_table.update_item(
                  Key={'map_id': map_id},
                  UpdateExpression=update_expr,
                  ExpressionAttributeValues=expr_values
              )
              return response(200, {'status': 'updated', 'map_id': map_id})

          def delete_map(map_id):
              maps_table.delete_item(Key={'map_id': map_id})
              return response(200, {'status': 'deleted'})

          # Tours functions - shared by all robots on a map
          # Tours store full sequence data: waypoints with speak/display actions, timing, etc.
          def get_tours(params):
              map_id = params.get('map_id') if params else None
              if map_id:
                  result = tours_table.query(
                      IndexName='by-map',
                      KeyConditionExpression='map_id = :m',
                      ExpressionAttributeValues={':m': map_id}
                  )
              else:
                  result = tours_table.scan()
              return response(200, {'tours': result.get('Items', [])})

          def create_tour(body):
              tour_id = body.get('tour_id') or str(uuid.uuid4())
              now = int(time.time() * 1000)
              # Store ALL fields from body - Flutter sends complete tour data
              item = convert_floats({
                  'tour_id': tour_id,
                  'map_id': body.get('map_id', ''),
                  'name': body.get('name', ''),
                  'description': body.get('description', ''),
                  'waypoints': body.get('waypoints', []),  # List of {name, speak_text, display_url, display_duration, wait_seconds}
                  'dwell_times': body.get('dwell_times', {}),
                  'loop': body.get('loop', False),
                  'announce_arrival': body.get('announce_arrival', False),
                  'rest_at_end_seconds': body.get('rest_at_end_seconds', 0),  # Wait at end before returning to start
                  'intro_text': body.get('intro_text'),
                  'outro_text': body.get('outro_text'),
                  'start_waypoint': body.get('start_waypoint'),
                  'end_waypoint': body.get('end_waypoint'),
                  'await_visitor_at_start': body.get('await_visitor_at_start', False),  # Show START TOUR button at start
                  'await_button_text': body.get('await_button_text'),  # Custom button text
                  'await_display_url': body.get('await_display_url'),  # Custom display URL while waiting
                  'modified_at': body.get('modified_at', now),
                  'created_at': body.get('created_at', now),
                  'updated_at': now
              })
              # Remove None values to avoid DynamoDB null issues
              item = {k: v for k, v in item.items() if v is not None}
              tours_table.put_item(Item=item)
              return response(200, {'status': 'created', 'tour_id': tour_id})

          def get_tour(tour_id):
              result = tours_table.get_item(Key={'tour_id': tour_id})
              item = result.get('Item')
              if item:
                  return response(200, item)
              return response(404, {'error': 'Tour not found'})

          def update_tour(tour_id, body):
              now = int(time.time() * 1000)
              # Build dynamic update expression for all provided fields
              update_expr_parts = ['updated_at = :updated_at']
              expr_values = {':updated_at': now}
              expr_names = {}

              # All supported tour fields
              field_map = {
                  'name': 'n', 'description': 'd', 'waypoints': 'w', 'dwell_times': 'dt',
                  'loop': 'l', 'announce_arrival': 'aa', 'rest_at_end_seconds': 'rae',
                  'intro_text': 'it', 'outro_text': 'ot',
                  'start_waypoint': 'sw', 'end_waypoint': 'ew', 'modified_at': 'ma', 'map_id': 'mi',
                  'await_visitor_at_start': 'avs', 'await_button_text': 'abt', 'await_display_url': 'adu'
              }

              for field, abbrev in field_map.items():
                  if field in body:
                      # Handle reserved words
                      if field in ['name']:
                          expr_names[f'#{abbrev}'] = field
                          update_expr_parts.append(f'#{abbrev} = :{abbrev}')
                      else:
                          update_expr_parts.append(f'{field} = :{abbrev}')
                      expr_values[f':{abbrev}'] = convert_floats(body[field])

              update_expr = 'SET ' + ', '.join(update_expr_parts)

              update_args = {
                  'Key': {'tour_id': tour_id},
                  'UpdateExpression': update_expr,
                  'ExpressionAttributeValues': expr_values
              }
              if expr_names:
                  update_args['ExpressionAttributeNames'] = expr_names

              tours_table.update_item(**update_args)
              return response(200, {'status': 'updated', 'tour_id': tour_id})

          def delete_tour(tour_id):
              tours_table.delete_item(Key={'tour_id': tour_id})
              return response(200, {'status': 'deleted'})

          def response(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Methods': 'GET, POST, PUT, DELETE, OPTIONS',
                      'Access-Control-Allow-Headers': 'Content-Type, X-API-Key',
                  },
                  'body': json.dumps(body, default=decimal_default)
              }

  # API Gateway
  FleetApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'frontiertower-api-${Environment}'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-API-Key
        MaxAge: 300

  FleetApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FleetApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FleetApiFunction.Arn
      PayloadFormatVersion: '2.0'

  FleetApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FleetApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${FleetApiIntegration}'

  FleetApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref FleetApi
      StageName: !Ref Environment
      AutoDeploy: true

  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FleetApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${FleetApi}/*'

Outputs:
  ApiEndpoint:
    Description: Fleet API Endpoint
    Value: !Sub 'https://${FleetApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub 'FrontierTower-ApiEndpoint-${Environment}'

  RobotsTableName:
    Description: DynamoDB Robots Table
    Value: !Ref RobotsTable

  CommandsTableName:
    Description: DynamoDB Commands Table
    Value: !Ref CommandsTable

  AlertsTableName:
    Description: DynamoDB Alerts Table
    Value: !Ref AlertsTable

  FleetConfigTableName:
    Description: DynamoDB Fleet Config Table (shared across ALL robots)
    Value: !Ref FleetConfigTable

  FloorsTableName:
    Description: DynamoDB Floors Table
    Value: !Ref FloorsTable

  MapsTableName:
    Description: DynamoDB Maps Table (maps belong to floors)
    Value: !Ref MapsTable

  ToursTableName:
    Description: DynamoDB Tours Table (tours belong to maps, shared by robots)
    Value: !Ref ToursTable
